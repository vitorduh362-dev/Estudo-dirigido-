<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trabalho avaliativo: decisões e repetições</title>
  <script src="scripts.js" defer></script>
</head>
<body>
  <h1>Trabalho avaliativo: decisões e repetições</h1>

  <h2>1. Controle de entrada em um evento</h2>
  <label for="campoIdade">Idade: </label>
  <input type="text" id="campoIdade">

  <label for="campoIngresso">Possui ingresso? (sim ou nao): </label>
  <input type="text" id="campoIngresso">

  <label for="campoConvite">Possui convite? (sim ou nao): </label>
  <input type="text" id="campoConvite">

  <label for="campoBloqueada">Está bloqueada? (sim ou nao): </label>
  <input type="text" id="campoBloqueada">

  <button type="button" id="btnEntrada">Verificar entrada</button>
  <div id="saidaEntrada"></div>

  <h2>2. Calculadora com switch</h2>
  <label for="campoNum1">Primeiro número: </label>
  <input type="text" id="campoNum1">

  <label for="campoOperacao">Operação (+, -, *, /): </label>
  <input type="text" id="campoOperacao">

  <label for="campoNum2">Segundo número: </label>
  <input type="text" id="campoNum2">

  <button type="button" id="btnCalcular">Calcular</button>
  <div id="saidaCalculadora"></div>

  <h2>3. Números pares e totalização com for</h2>
  <label for="campoLimiteN">Número inteiro N (1 a 100): </label>
  <input type="text" id="campoLimiteN">

  <button type="button" id="btnPares">Processar pares</button>
  <div id="saidaPares"></div>

  <h2>4. Simulação de economia com while</h2>
  <label for="campoMeta">Meta de economia (R$, 1 a 10.000): </label>
  <input type="text" id="campoMeta">

  <label for="campoDeposito">Depósito mensal fixo (R$, 1 a 10.000): </label>
  <input type="text" id="campoDeposito">

  <button type="button" id="btnSimular">Simular economia</button>
  <div id="saidaSimulacao"></div>
</body>
</html>
