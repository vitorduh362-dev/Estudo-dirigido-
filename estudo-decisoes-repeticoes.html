<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decisões e repetições</title>
  <script src="scripts.js" defer></script>
</head>
<body>
  <h1>Estudo dirigido: decisões e repetições</h1>

  <h2>1. Classificar um número</h2>
  <label for="campoNumero">Número: </label>
  <input type="text" id="campoNumero">
  <button type="button" id="btnNumero">Classificar</button>
  <div id="saidaNumero"></div>

  <h2>2. Verificar aprovação</h2>
  <label for="campoMedia">Média, de 0 a 10:</label>
  <input type="text" id="campoMedia">
  <label for="campoFrequencia">Frequência, de 0 a 100:</label>
  <input type="text" id="campoFrequencia">
  <button type="button" id="btnAprovacao">Verificar aprovação</button>
  <div id="saidaAprovacao"></div>

  <h2>3. Verificar frete grátis</h2>
  <label for="campoCompra">Valor da compra: </label>
  <input type="text" id="campoCompra">
  <label for="campoCupom">Cupom, se houver:</label>
  <input type="text" id="campoCupom">
  <button type="button" id="btnFrete">Verificar frete</button>
  <div id="saidaFrete"></div>

  <h2>4. Verificar bloqueio do cadastro</h2>
  <label for="campoBloqueio">Cadastro bloqueado? Digite sim ou nao:</label>
  <input type="text" id="campoBloqueio">
  <button type="button" id="btnBloqueio">Verificar acesso</button>
  <div id="saidaBloqueio"></div>

  <h2>5. Identificar o turno</h2>
  <p>1 Manhã | 2 Tarde | 3 Noite</p>
  <label for="campoTurno">Código do turno: </label>
  <input type="text" id="campoTurno">
  <button type="button" id="btnTurno">Mostrar turno</button>
  <div id="saidaTurno"></div>

  <h2>6. Gerar uma tabuada</h2>
  <label for="campoTabuada">Número: </label>
  <input type="text" id="campoTabuada">
  <button type="button" id="btnTabuada">Gerar tabuada</button>
  <div id="saidaTabuada"></div>

  <h2>7. Fazer uma contagem regressiva</h2>
  <label for="campoContagem">Número inteiro de 1 a 100:</label>
  <input type="text" id="campoContagem">
  <button type="button" id="btnContagem">Iniciar contagem</button>
  <div id="saidaContagem"></div>
</body>
</html>
